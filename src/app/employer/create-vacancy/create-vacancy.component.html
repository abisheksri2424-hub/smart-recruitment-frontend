<div class="create-vacancy-container">

  <h2>Create Vacancy</h2>

  <p
    class="error-message"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </p>

  <form (ngSubmit)="createVacancy()">

    <label>Job Title</label>
    <input
      type="text"
      name="title"
      [(ngModel)]="title"
      required
    />

    <label>Description</label>
    <textarea
      name="description"
      [(ngModel)]="description"
      required
    ></textarea>

    <label>Location</label>
    <input
      type="text"
      name="location"
      [(ngModel)]="location"
    />

    <label>Minimum Experience</label>
    <input
      type="number"
      name="minimumExperienceYears"
      [(ngModel)]="minimumExperienceYears"
      min="0"
      required
    />

    <label>Required Education Level</label>
    <select
      name="requiredEducationLevel"
      [(ngModel)]="requiredEducationLevel"
      required
    >
      <option [ngValue]="0">Not Specified</option>
      <option [ngValue]="1">O Level</option>
      <option [ngValue]="2">A Level</option>
      <option [ngValue]="3">Diploma</option>
      <option [ngValue]="4">Bachelor</option>
      <option [ngValue]="5">Master</option>
      <option [ngValue]="6">Doctorate</option>
    </select>

    <label>Required Skills</label>
    <input
      type="text"
      name="requiredSkills"
      [(ngModel)]="requiredSkills"
      placeholder="C#, ASP.NET Core, SQL Server"
    />

    <button
      type="submit"
      [disabled]="loading"
    >
      {{ loading ? 'Creating...' : 'Create Vacancy' }}
    </button>

  </form>

</div>
