<div class="form-container">

  <h2>Create Vacancy</h2>

  <p>
    Enter the job vacancy details below.
  </p>

  <form (ngSubmit)="submitForm()">

    <label>
      Job Title
    </label>

    <input
      type="text"
      name="title"
      [(ngModel)]="vacancy.title"
      required
    />

    <label>
      Description
    </label>

    <textarea
      name="description"
      [(ngModel)]="vacancy.description"
      rows="5"
      required
    ></textarea>

    <label>
      Location
    </label>

    <input
      type="text"
      name="location"
      [(ngModel)]="vacancy.location"
    />

    <label>
      Minimum Experience Years
    </label>

    <input
      type="number"
      name="minimumExperienceYears"
      [(ngModel)]="vacancy.minimumExperienceYears"
      min="0"
    />

    <label>
      Required Education Level
    </label>

    <input
      type="number"
      name="requiredEducationLevel"
      [(ngModel)]="vacancy.requiredEducationLevel"
      min="0"
    />

    <button
      type="submit"
      [disabled]="loading">

      {{
        loading
          ? 'Creating...'
          : 'Create Vacancy'
      }}

    </button>

  </form>

  <p
    class="success-message"
    *ngIf="successMessage">

    {{ successMessage }}

  </p>

  <p
    class="error-message"
    *ngIf="errorMessage">

    {{ errorMessage }}

  </p>

</div>
