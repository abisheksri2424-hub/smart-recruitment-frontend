<app-navbar></app-navbar>

<div class="employer-dashboard">

  <h2>Employer Dashboard</h2>

  <p>
    Manage vacancies and applicants from here.
  </p>

  <div class="dashboard-cards">

    <div class="dashboard-card">
      <h3>My Vacancies</h3>

      <p>
        View and manage posted vacancies.
      </p>

      <a
        routerLink="/employer/vacancy"
        class="dashboard-button"
      >
        View Vacancies
      </a>
    </div>

    <div class="dashboard-card">
      <h3>Create Vacancy</h3>

      <p>
        Post a new job vacancy.
      </p>

      <a
        routerLink="/employer/create-vacancy"
        class="dashboard-button"
      >
        Create Vacancy
      </a>
    </div>

    <div class="dashboard-card">
      <h3>Applicants</h3>

      <p>
        Select a vacancy to view its applicants.
      </p>

      <a
        routerLink="/employer/vacancy"
        class="dashboard-button"
      >
        View Applicants
      </a>
    </div>

  </div>

</div>
